name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated token artefacts are committed so the app builds without a
      # codegen step; this fails if they drift from tokens/colors.json.
      - name: Token drift
        run: pnpm run tokens:check

      - name: Icon drift
        run: pnpm run icons:check

      # The app icon, derived from build/icon-source.png. Under xvfb because
      # it runs Electron — nativeImage does the resizing and no window is
      # opened, but app.whenReady() still wants a display on Linux.
      - name: App icon drift
        run: xvfb-run -a pnpm run icon:check

      # The committed woff2 files against the installed @fontsource packages.
      # A version bump that changes the binaries has to land as a diff.
      - name: Font drift
        run: pnpm run fonts:check

      # Generated TypeScript vs the committed spec. Cheap and always run —
      # catches a hand-edited or un-regenerated client. Whether the spec
      # itself is stale is a cross-repo question, handled by spec-drift.yml.
      - name: API client drift
        run: pnpm run api:check

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build Storybook
        run: pnpm run build:storybook

  e2e:
    name: E2E (Playwright + Electron)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No `playwright install` — these tests drive the Electron binary that
      # is already a dependency, not a downloaded browser.
      #
      # xvfb because Electron has no headless mode that still paints; the
      # parity tests measure real layout, so there has to be a display.
      - name: E2E
        run: xvfb-run -a pnpm run e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: electron-builder dry run
    # Packaging is slow and only meaningful for what actually lands, so it
    # runs on main rather than on every push to a branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package (unpacked, no publish)
        run: pnpm run pack:dry
